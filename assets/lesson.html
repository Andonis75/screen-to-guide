<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; media-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>__LESSON_TITLE__</title>
<style>
:root{--paper:#fff;--ink:#182332;--muted:#637080;--accent:#285794;--line:#dfe4e9;--wash:#f7f8fa;--body:"Source Han Sans SC","Microsoft YaHei","PingFang SC",sans-serif;--display:"Source Han Serif SC","Noto Serif CJK SC","Songti SC",Georgia,serif;--mono:Consolas,"SFMono-Regular",monospace;--small:12px;--body-size:16px;--leading:1.95}
*{box-sizing:border-box}html{scroll-padding-top:30px}body{margin:0;background:var(--paper);color:var(--ink);font:var(--body-size)/var(--leading) var(--body)}a{color:var(--accent);text-underline-offset:4px}button,a{touch-action:manipulation}button{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);padding:8px 13px;cursor:pointer}button:hover{border-color:var(--accent);background:var(--wash)}button:disabled{opacity:.6;cursor:wait}button:focus-visible,a:focus-visible{outline:3px solid #90b5e6;outline-offset:4px}[hidden]{display:none!important}.skip{position:absolute;left:20px;top:-60px}.skip:focus{top:8px;background:var(--paper);z-index:10}.masthead{max-width:1220px;margin:auto;padding:22px 32px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:12px;font-weight:700;letter-spacing:.15em;color:var(--accent)}.tools{display:flex;gap:8px;flex-wrap:wrap}.layout{max-width:1220px;padding:50px 32px 85px;margin:auto;display:grid;grid-template-columns:212px minmax(0,1fr);gap:62px;align-items:start}.contents{position:sticky;top:30px;max-height:calc(100vh - 60px);overflow:auto;padding-right:10px;font-size:13px;line-height:1.6}.contents h2{font-size:12px;color:var(--muted);letter-spacing:.12em;margin:0 0 18px}.contents ol{list-style:none;padding:0;margin:0}.contents li{margin:0 0 4px}.contents a{display:block;border-left:2px solid transparent;padding:8px 0 8px 13px;text-decoration:none;color:var(--muted);overflow-wrap:anywhere}.contents a:hover,.contents a[aria-current=true]{color:var(--accent);border-color:var(--accent)}.toc-number{font:12px var(--mono);color:var(--accent);display:inline-block;min-width:27px}.document{min-width:0}.eyebrow{font-size:12px;color:var(--accent);letter-spacing:.14em;margin:0 0 15px}h1{font:600 clamp(30px,3.5vw,44px)/1.45 var(--display);letter-spacing:-.025em;margin:0 0 24px;overflow-wrap:anywhere}.summary{font-size:18px;line-height:1.9;color:#46576b;white-space:pre-line;margin:0 0 22px}.metadata{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:7px 18px;margin:0 0 20px;overflow-wrap:anywhere}.intro{padding:0 0 34px}.intro .watch{color:var(--accent);border-color:#cad9ec}.auxiliary,.chapter{border-top:1px solid var(--line);padding:34px 0 38px;scroll-margin-top:30px}.auxiliary h2{font-size:23px;line-height:1.5;margin:0 0 20px}.chapter-heading{display:flex;align-items:baseline;gap:17px;margin:0 0 12px}.chapter-number{flex:none;color:var(--accent);font:30px/1.4 Georgia,serif}.chapter h2{font-size:25px;line-height:1.6;margin:0;overflow-wrap:anywhere}.time-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:12px 0 25px}.time{font:12px/1.7 var(--mono);color:var(--muted)}.jump{font-size:12px;color:var(--accent);padding:5px 10px}.prose{margin:18px 0;white-space:pre-line;overflow-wrap:anywhere}.points,.steps,.prerequisites{padding-left:24px;margin:20px 0}.points li,.steps li,.prerequisites li{padding-left:4px;margin:10px 0;white-space:pre-line;overflow-wrap:anywhere}.chapter h3{font-size:16px;letter-spacing:.025em;margin:26px 0 12px}.code-block{margin:24px 0}.code-label{font:11px/1.7 var(--mono);color:var(--muted);margin:0 0 7px}pre{padding:18px 20px;margin:0;border-left:3px solid #b8cbe3;background:var(--wash);overflow:auto;tab-size:4}code{font:13px/1.8 var(--mono)}figure{margin:30px 0}figure a{display:block;line-height:0}img{width:100%;height:auto;display:block;border:1px solid var(--line);background:var(--wash)}figcaption{font-size:12px;color:var(--muted);line-height:1.8;margin-top:10px;text-align:left;overflow-wrap:anywhere}.figure-time{margin-right:9px;font:11px var(--mono);padding:2px 6px;color:var(--accent)}.note{border-left:3px solid #bdcde0;padding-left:17px;color:#526277;font-size:14px;white-space:pre-line;overflow-wrap:anywhere;margin:26px 0 0}.note strong{color:var(--ink)}.glossary{display:grid;grid-template-columns:minmax(95px,1fr) minmax(0,3fr);gap:14px 25px;margin:0}.glossary dt{font-weight:600;overflow-wrap:anywhere}.glossary dd{margin:0;color:#526277;white-space:pre-line;overflow-wrap:anywhere}.references{padding-left:24px;margin:0}.references li{margin:10px 0;overflow-wrap:anywhere}.footer{max-width:1220px;margin:auto;border-top:1px solid var(--line);padding:20px 32px;display:flex;gap:20px;justify-content:space-between;font-size:12px;color:var(--muted)}dialog{width:min(980px,94vw);max-height:92vh;padding:22px;border:1px solid var(--line);border-radius:7px;box-shadow:0 18px 70px #18233224;color:var(--ink)}dialog::backdrop{background:#15243973}.player-header{display:flex;align-items:start;justify-content:space-between;gap:20px;margin-bottom:15px}.player-header h2{font-size:18px;line-height:1.5;margin:0}.player-header p{font-size:12px;color:var(--muted);margin:5px 0 0}video{display:block;width:100%;max-height:68vh;background:#101820}.status{font-size:12px;color:var(--muted)}.status:empty{display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr;gap:25px;padding:28px 25px 60px}.contents{position:static;max-height:none;border-bottom:1px solid var(--line);padding:0 0 22px}.contents ol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px}.contents h2{margin-bottom:10px}.contents a{padding:6px 0 6px 11px}.intro{padding-bottom:25px}.chapter{padding:29px 0 32px}}
@media(max-width:520px){.masthead{padding:16px 18px;align-items:flex-start}.brand{padding-top:7px;letter-spacing:.07em}.tools{justify-content:flex-end;gap:6px}.tools button{font-size:11px;padding:7px 8px}.layout{padding:24px 18px 45px}.contents ol{grid-template-columns:1fr}.summary{font-size:16px}.chapter-heading{gap:12px}.chapter h2{font-size:22px}.chapter-number{font-size:27px}.glossary{grid-template-columns:1fr;gap:6px}.glossary dd{margin-bottom:14px}.footer{padding:18px}.prose,.points,.steps{font-size:15px}pre{padding:14px}dialog{padding:15px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
@media print{@page{size:A4;margin:17mm 15mm}body{font-size:10.5pt;line-height:1.8}.masthead,.contents,.tools,.skip,.watch,.jump,.figure-time,dialog,.footer,.status{display:none!important}.layout{display:block;padding:0;max-width:none}.intro{padding-bottom:22px}h1{font-size:26pt}.summary{font-size:12pt}.chapter,.auxiliary{padding:22px 0}.chapter-heading,.chapter h2,.auxiliary h2,h3{break-after:avoid}.chapter h2,.auxiliary h2{font-size:17pt}.chapter-number{font-size:22pt}.prose,.points,.steps{font-size:10.5pt}figure,.note{break-inside:avoid}figure img{max-height:190mm;object-fit:contain}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f8f8f8}code{font-size:9pt}a{color:inherit;text-decoration:none}.metadata a:after,.references a:after{content:" (" attr(href) ")";overflow-wrap:anywhere}.metadata{font-size:8.5pt}.time{display:inline!important}figcaption{font-size:8pt}}
.player-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.player-actions button{color:var(--accent)}#player video{max-height:calc(92vh - 235px);min-height:120px}
</style>
</head>
<body>
<a class="skip" href="#document">跳到教材正文</a>
<header class="masthead"><span class="brand">录屏成册 / 阅读教材</span><div class="tools"><button id="download-md" type="button">下载 Markdown</button><button id="print-guide" type="button">打印 / 存为 PDF</button></div></header>
<div class="layout">
<nav class="contents" aria-label="章节目录"><h2>本篇目录</h2><ol id="toc"></ol></nav>
<main class="document" id="document">
<header class="intro" id="overview"><p class="eyebrow" id="chapter-count"></p><h1 id="title"></h1><p class="summary" id="summary"></p><div class="metadata" id="metadata"></div><button id="watch-all" class="watch" type="button" hidden>播放完整视频</button><p id="download-status" class="status" role="status" aria-live="polite"></p></header>
<section class="auxiliary" id="preparation" hidden><h2>开始前</h2><ul class="prerequisites" id="prerequisites"></ul></section>
<div id="chapters"></div>
<section class="auxiliary" id="terms" hidden><h2>术语速查</h2><dl class="glossary" id="glossary"></dl></section>
<section class="auxiliary" id="sources" hidden><h2>参考资料</h2><ol class="references" id="references"></ol></section>
</main></div>
<footer class="footer"><span id="footer-count"></span><a href="#overview">回到开头 ↑</a></footer>
<dialog id="player" aria-labelledby="player-title"><div class="player-header"><div><h2 id="player-title">课程视频</h2><p id="player-time"></p></div><button id="close-video" type="button" aria-label="关闭视频">关闭 ×</button></div><video id="video" controls preload="none"></video><div id="player-actions" class="player-actions" hidden><button id="replay-chapter" type="button">重播本章</button><button id="continue-video" type="button">继续播放完整视频</button></div><p id="video-status" class="status" role="status"></p></dialog>
<noscript><p>请启用 JavaScript 阅读交互教材，或打开同目录的 guide.md。</p></noscript>
<script id="lesson-data" type="application/json">__LESSON_DATA__</script>
<script>
"use strict";
const payload=JSON.parse(document.getElementById("lesson-data").textContent),data=payload.lesson;
const $=id=>document.getElementById(id),make=(tag,text)=>{const el=document.createElement(tag);if(text!==undefined)el.textContent=text;return el;};
const local=path=>path.split("/").map(encodeURIComponent).join("/");
function time(seconds){const ticks=Math.floor(seconds*10),hours=Math.floor(ticks/36000),minutes=Math.floor(ticks/600)%60;return(hours?String(hours).padStart(2,"0")+":":"")+String(minutes).padStart(2,"0")+":"+String(Math.floor(ticks/10)%60).padStart(2,"0")+"."+ticks%10;}
function toc(id,title,number){const li=make("li"),a=make("a");a.href="#"+id;if(number!==undefined){const n=make("span",String(number).padStart(2,"0"));n.className="toc-number";a.append(n);}a.append(make("span",title));li.append(a);$("toc").append(li);}
function external(title,url){const a=make("a",title);a.href=url;a.target="_blank";a.rel="noopener noreferrer";return a;}
$("title").textContent=data.title;$("summary").textContent=data.summary;$("summary").hidden=!data.summary;
$("chapter-count").textContent=data.sections.length+" 章 · "+time(data.source.duration_seconds)+" 视频教材";$("footer-count").textContent=data.sections.length+" 章 · 离线阅读";
$("metadata").append(make("span",data.source.name));if(data.source.author)$("metadata").append(make("span","作者："+data.source.author));if(data.source.url)$("metadata").append(external("查看来源 ↗",data.source.url));toc("overview","课程概览");
if(data.prerequisites.length){$("preparation").hidden=false;data.prerequisites.forEach(item=>$("prerequisites").append(make("li",item)));toc("preparation","开始前");}
// LESSON_PLAYER_START
const video=$("video"),player=$("player");
let requested=null,pendingStart=null,frameWatch=null,endWatch=null,watchGeneration=0;
function cancelWatch(){
 watchGeneration++;
 if(frameWatch!==null)cancelAnimationFrame(frameWatch);
 if(endWatch!==null)clearTimeout(endWatch);
 frameWatch=null;endWatch=null;
}
function chapterEnd(){return requested&&requested.end!==null?Math.min(requested.end,Number.isFinite(video.duration)?video.duration:requested.end):null;}
function finishChapter(){
 const end=chapterEnd();if(end===null)return;
 cancelWatch();video.pause();
 if(Math.abs(video.currentTime-end)>0.001)video.currentTime=end;
 $("video-status").textContent="本章播放完毕，可以照着文档操作，或重播本章。";
}
function enforceRange(){
 const end=chapterEnd();if(end===null||pendingStart!==null||video.readyState<1)return false;
 if(video.currentTime>=end){finishChapter();return true;}
 if(video.currentTime<requested.start)video.currentTime=requested.start;
 return false;
}
function watchBoundary(){
 cancelWatch();
 if(!requested||requested.end===null||video.paused||pendingStart!==null)return;
 const generation=watchGeneration;
 const check=()=>{
  if(generation!==watchGeneration||!player.open)return;
  if(enforceRange()||video.paused)return;
  frameWatch=requestAnimationFrame(check);
 };
 const timer=()=>{
  if(generation!==watchGeneration||!player.open)return;
  if(enforceRange()||video.paused)return;
  const remaining=(chapterEnd()-video.currentTime)/Math.max(video.playbackRate,0.1);
  endWatch=setTimeout(timer,Math.max(10,Math.min(200,remaining*1000)));
 };
 frameWatch=requestAnimationFrame(check);timer();
}
function playRequested(){
 const selection=requested;
 video.play().catch(error=>{
  if(requested===selection&&player.open&&error.name!=="AbortError")$("video-status").textContent="点击视频播放按钮开始。";
 });
}
function beginPlayback(){
 if(!requested||pendingStart===null||video.readyState<1||!player.open)return;
 const start=pendingStart;pendingStart=null;video.currentTime=start;playRequested();
}
function openVideo(start=0,end=null,title="完整视频",rangeStart=start){
 cancelWatch();video.pause();requested={start:rangeStart,end,title};pendingStart=start;
 $("player-title").textContent=title;
 $("player-time").textContent=end===null?"完整视频 · 可自由拖动进度":"本章 "+time(rangeStart)+"–"+time(end)+" · 到点自动暂停";
 $("player-actions").hidden=end===null;$("video-status").textContent="";
 if(!player.open)player.showModal();
 if(!video.getAttribute("src")){video.src=local(data.video);video.load();}
 beginPlayback();
}
function jumpButton(start,end,title,label,rangeStart=start){const button=make("button",label);button.type="button";button.className="jump";button.addEventListener("click",()=>openVideo(start,end,title,rangeStart));return button;}
if(data.video){$("watch-all").hidden=false;$("watch-all").addEventListener("click",()=>openVideo());}
$("replay-chapter").addEventListener("click",()=>{if(requested)openVideo(requested.start,requested.end,requested.title);});
$("continue-video").addEventListener("click",()=>openVideo(video.currentTime,null));
video.addEventListener("loadedmetadata",beginPlayback);
video.addEventListener("play",()=>{
 if(!requested||!player.open){video.pause();return;}
 const end=chapterEnd();
 if(end!==null&&(video.currentTime>=end-0.001||video.currentTime<requested.start))video.currentTime=requested.start;
 $("video-status").textContent="";watchBoundary();
});
video.addEventListener("playing",watchBoundary);
video.addEventListener("pause",cancelWatch);
video.addEventListener("ratechange",watchBoundary);
video.addEventListener("timeupdate",enforceRange);
video.addEventListener("seeking",enforceRange);
video.addEventListener("seeked",()=>{if(!enforceRange())watchBoundary();});
video.addEventListener("ended",()=>{cancelWatch();if(chapterEnd()!==null)finishChapter();});
video.addEventListener("error",()=>{cancelWatch();$("video-status").textContent="视频未能打开，请保留教材目录中的本地视频文件。";});
$("close-video").addEventListener("click",()=>player.close());player.addEventListener("close",()=>{cancelWatch();video.pause();requested=null;pendingStart=null;});
player.addEventListener("click",event=>{if(event.target!==player)return;const box=player.getBoundingClientRect();if(event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom)player.close();});
// LESSON_PLAYER_END
data.sections.forEach((chapter,index)=>{
 const section=make("section");section.className="chapter";section.id="chapter-"+(index+1);
 const heading=make("div");heading.className="chapter-heading";const number=make("span",String(index+1).padStart(2,"0"));number.className="chapter-number";heading.append(number,make("h2",chapter.title));section.append(heading);
 const row=make("div"),range=make("span",time(chapter.start_seconds)+"–"+time(chapter.end_seconds));row.className="time-row";range.className="time";row.append(range);if(data.video)row.append(jumpButton(chapter.start_seconds,chapter.end_seconds,chapter.title,"▶ 播放本章"));section.append(row);
 chapter.paragraphs.forEach(text=>{const p=make("p",text);p.className="prose";section.append(p);});
 if(chapter.bullets.length){const ul=make("ul");ul.className="points";chapter.bullets.forEach(text=>ul.append(make("li",text)));section.append(ul);}
 if(chapter.steps.length){section.append(make("h3","动手步骤"));const ol=make("ol");ol.className="steps";chapter.steps.forEach(text=>ol.append(make("li",text)));section.append(ol);}
 chapter.code_blocks.forEach(block=>{const wrap=make("div"),label=make("p",block.language||"代码"),pre=make("pre"),code=make("code",block.code);wrap.className="code-block";label.className="code-label";pre.append(code);wrap.append(label,pre);section.append(wrap);});
 chapter.images.forEach(item=>{const figure=make("figure"),a=make("a"),img=make("img"),caption=make("figcaption");a.href=local(item.path);a.target="_blank";a.rel="noopener noreferrer";a.setAttribute("aria-label","查看原图："+(item.caption||chapter.title));img.src=local(item.path);img.alt=item.caption||chapter.title;img.loading="lazy";img.decoding="async";if(data.source.width&&data.source.height){img.width=data.source.width;img.height=data.source.height;}a.append(img);if(data.video){const button=jumpButton(item.timestamp_seconds,chapter.end_seconds,chapter.title,time(item.timestamp_seconds),chapter.start_seconds);button.className="figure-time";button.setAttribute("aria-label","播放截图对应视频 "+time(item.timestamp_seconds));caption.append(button);}else caption.append(make("span",time(item.timestamp_seconds)+" · "));caption.append(make("span",item.caption||chapter.title));figure.append(a,caption);section.append(figure);});
 if(chapter.note){const note=make("aside");note.className="note";note.append(make("strong","补充说明　"),make("span",chapter.note));section.append(note);}
 $("chapters").append(section);toc(section.id,chapter.title,index+1);
});
if(data.glossary.length){$("terms").hidden=false;data.glossary.forEach(item=>$("glossary").append(make("dt",item.term),make("dd",item.definition)));toc("terms","术语速查");}
if(data.references.length){$("sources").hidden=false;data.references.forEach(item=>{const li=make("li");li.append(external(item.title,item.url));$("references").append(li);});toc("sources","参考资料");}
if("IntersectionObserver" in window){const observer=new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting)document.querySelectorAll("#toc a").forEach(link=>link.setAttribute("aria-current",String(link.getAttribute("href")==="#"+entry.target.id)));},{rootMargin:"-10% 0px -70% 0px",threshold:0});document.querySelectorAll("#overview,.chapter,.auxiliary:not([hidden])").forEach(section=>observer.observe(section));}
$("download-md").addEventListener("click",()=>{const url=URL.createObjectURL(new Blob([payload.markdown],{type:"text/markdown;charset=utf-8"})),a=make("a");a.href=url;a.download="guide.md";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);$("download-status").textContent="已请求下载 guide.md，请查看浏览器下载记录。";});
$("print-guide").addEventListener("click",async()=>{const button=$("print-guide");button.disabled=true;try{const images=[...document.images];images.forEach(img=>img.loading="eager");await Promise.allSettled(images.map(img=>img.decode()));window.print();}finally{button.disabled=false;}});
</script>
</body>
</html>
