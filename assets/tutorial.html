<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; media-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>__GUIDE_TITLE__</title>
<style>
:root{--ink:#182c46;--muted:#647286;--blue:#1f52ae;--line:#dce4ee;--wash:#f5f8fc;--body:"Microsoft YaHei","PingFang SC",sans-serif}
*{box-sizing:border-box}html{scroll-behavior:auto;scroll-padding-top:28px}body{margin:0;background:#fff;color:var(--ink);font:16px/1.9 var(--body)}button,a,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}a{color:var(--blue);text-underline-offset:4px}button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 15px;border-radius:5px;font-size:13px}button:hover{border-color:var(--blue);background:var(--wash)}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #87adef;outline-offset:4px}[hidden]{display:none!important}.skip{position:absolute;left:20px;top:-60px}.skip:focus{top:8px;background:#fff;z-index:5}.masthead{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:18px;padding:20px 30px;border-bottom:1px solid var(--line)}.brand{font-size:13px;color:var(--blue);font-weight:700;letter-spacing:.12em}.tools{display:flex;gap:8px;flex-wrap:wrap}.layout{max-width:1180px;margin:auto;padding:48px 30px 80px;display:grid;grid-template-columns:204px minmax(0,1fr);gap:55px;align-items:start}.contents{position:sticky;top:28px;font-size:13px;line-height:1.6;max-height:calc(100vh - 56px);overflow:auto;padding-right:12px}.contents h2{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin:0 0 17px}.contents ol{list-style:none;margin:0;padding:0}.contents li{margin:0 0 4px}.contents a{display:block;border-left:2px solid transparent;padding:8px 0 8px 14px;color:var(--muted);text-decoration:none;overflow-wrap:anywhere}.contents a:hover,.contents a[aria-current=true]{border-left-color:var(--blue);color:var(--blue);background:linear-gradient(90deg,#f1f6ff,transparent)}.contents .toc-number{display:inline-block;width:25px;color:var(--blue);font:12px Consolas,monospace}.document{min-width:0}.intro{padding-bottom:30px}.eyebrow{margin:0 0 13px;color:var(--blue);font-size:12px;letter-spacing:.14em;font-weight:700}h1{font-size:clamp(29px,3.4vw,42px);line-height:1.45;letter-spacing:-.025em;margin:0 0 19px;font-weight:700;overflow-wrap:anywhere}.summary{font-size:17px;line-height:1.95;color:#526177;margin:0;white-space:pre-line}.doc-section{padding:24px 0 30px;border-top:1px solid var(--line);scroll-margin-top:28px}.doc-section h2{font-size:23px;line-height:1.55;margin:0 0 19px;overflow-wrap:anywhere}.preparation{padding:0;list-style:none;margin:0}.preparation li{padding-left:24px;position:relative;margin:9px 0}.preparation li:before{content:"✓";color:var(--blue);position:absolute;left:0}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px;text-align:left}th,td{padding:13px 17px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere;white-space:pre-line}th{background:var(--wash);font-weight:600}td:first-child{width:34%;color:var(--muted)}.step{padding:37px 0 39px;border-top:1px solid var(--line);scroll-margin-top:28px}.step-heading{display:flex;align-items:baseline;gap:15px}.step-number{font:30px/1.4 Georgia,serif;color:var(--blue);flex:none}.step h2{font-size:25px;line-height:1.55;margin:0;overflow-wrap:anywhere}.time-row{margin:13px 0 22px}.time-button{color:var(--blue);font-size:12px;padding:5px 11px;background:#f7faff;border-color:#d8e4f8}.time-label{color:var(--muted);font:12px Consolas,monospace}.step-description{margin:0 0 16px;white-space:pre-line;overflow-wrap:anywhere}.actions{margin:0 0 22px;padding-left:25px}.actions li{padding-left:5px;margin:10px 0;white-space:pre-line;overflow-wrap:anywhere}.outcome{margin:22px 0;padding-left:16px;border-left:3px solid #b5ccec;white-space:pre-line;overflow-wrap:anywhere}.outcome strong{color:var(--blue);margin-right:7px}.tip{font-size:14px;color:var(--muted);margin:17px 0 0;white-space:pre-line;overflow-wrap:anywhere}.tip strong{color:var(--ink);margin-right:7px}figure{margin:27px 0 0}figure a{display:block;line-height:0}figure img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:3px;background:var(--wash)}figcaption{font-size:12px;color:var(--muted);text-align:center;margin-top:9px;line-height:1.6}.completion{padding:27px 0 10px;border-top:3px solid var(--blue)}.completion h2{font-size:23px;margin:0 0 10px}.completion p{white-space:pre-line;margin:0}.page-footer{max-width:1180px;margin:auto;padding:20px 30px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:12px}.video-trigger{font-size:13px;margin-top:22px}.image-error{font-size:13px;color:var(--muted);padding:18px;background:var(--wash)}dialog{padding:22px;border:1px solid var(--line);border-radius:9px;width:min(900px,92vw);max-height:90vh;color:var(--ink);box-shadow:0 15px 70px #10234726}dialog::backdrop{background:#10213a66}.dialog-header{display:flex;gap:20px;justify-content:space-between;align-items:start;margin-bottom:15px}.dialog-header h2{font-size:18px;margin:0}.dialog-header p{font-size:13px;margin:3px 0;color:var(--muted)}video{display:block;width:100%;max-height:65vh;background:#f2f4f7}#video-status,#download-status{font-size:12px;color:var(--muted)}#download-status:empty{display:none}
@media(max-width:850px){.layout{grid-template-columns:1fr;gap:28px;padding:28px 24px 55px}.contents{position:static;max-height:none;padding:0 0 19px;border-bottom:1px solid var(--line)}.contents ol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px 14px}.contents h2{margin-bottom:8px}.contents a{padding:6px 0 6px 10px}.step h2{font-size:22px}.masthead{padding:16px 24px}.intro{padding-bottom:18px}.step{padding:28px 0}.summary{font-size:16px}}
@media(max-width:500px){.layout{padding:23px 18px 45px}.masthead{padding:15px 18px;align-items:flex-start}.brand{padding-top:7px}.tools{justify-content:flex-end;gap:6px}.tools button{padding:7px 9px;font-size:12px}.contents ol{grid-template-columns:1fr}.step-heading{gap:11px}.step-number{font-size:27px}.step h2{font-size:21px}th,td{padding:10px 11px}.page-footer{padding:18px;font-size:11px}dialog{padding:15px}.step-description,.actions{font-size:15px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media print{@page{size:A4;margin:17mm 15mm}body{font-size:10.5pt;line-height:1.7;color:#172638}.masthead,.contents,.tools,.skip,.time-button,.video-trigger,dialog,.page-footer,#download-status{display:none!important}.layout{display:block;max-width:none;padding:0}.intro{padding-bottom:20px}h1{font-size:25pt}.summary{font-size:11pt}.doc-section,.step{padding:20px 0}.doc-section h2,.step h2{font-size:17pt;break-after:avoid}.step-heading,.time-row{break-after:avoid}.step-number{font-size:21pt}.step-description,.actions{font-size:10.5pt}figure,table,.outcome,.tip,.completion{break-inside:avoid}figure img{max-height:210mm;object-fit:contain}a{color:inherit;text-decoration:none}figcaption{font-size:8pt}.time-label{display:inline!important}}
</style>
</head>
<body>
<a class="skip" href="#document">跳到教程正文</a>
<header class="masthead"><span class="brand">知行册 / 操作指南</span><div class="tools"><button id="download-md">下载 Markdown</button><button id="print-guide">打印 / 存为 PDF</button></div></header>
<div class="layout"><nav class="contents" aria-label="教程目录"><h2>本篇目录</h2><ol id="toc"></ol></nav><main class="document" id="document"><header class="intro" id="overview"><p class="eyebrow" id="step-count"></p><h1 id="title"></h1><p class="summary" id="summary"></p><button class="video-trigger" id="open-video" hidden>查看完整录屏</button><p id="download-status" role="status" aria-live="polite"></p></header><section class="doc-section" id="preparation" hidden><h2>开始前</h2><ul class="preparation" id="prerequisites"></ul></section><section class="doc-section" id="settings" hidden><h2>本例参数</h2><div class="table-wrap"><table><thead><tr><th scope="col">参数</th><th scope="col">设置</th></tr></thead><tbody id="settings-body"></tbody></table></div></section><div id="steps"></div><section class="completion" id="completion" hidden><h2>完成</h2><p id="completion-text"></p></section></main></div>
<footer class="page-footer"><span id="footer-count"></span><a href="#overview">回到开头 ↑</a></footer>
<dialog id="player" aria-labelledby="player-title"><div class="dialog-header"><div><h2 id="player-title">原始录屏</h2><p id="player-time"></p></div><button id="close-video" aria-label="关闭录屏">关闭 ×</button></div><video id="video" controls preload="metadata"></video><p id="video-status" role="status"></p></dialog>
<noscript><p>请启用 JavaScript 阅读交互教程，或打开同目录的 guide.md。</p></noscript>
<script id="guide-data" type="application/json">__GUIDE_DATA__</script>
<script>
"use strict";
const data=JSON.parse(document.getElementById("guide-data").textContent),tutorial=data.tutorial;
const $=id=>document.getElementById(id),make=(tag,text)=>{const el=document.createElement(tag);if(text!==undefined)el.textContent=text;return el;};
const local=p=>p.split("/").map(encodeURIComponent).join("/"),time=s=>{const n=Math.floor(s*10);return String(Math.floor(n/600)).padStart(2,"0")+":"+String(Math.floor(n/10)%60).padStart(2,"0")+"."+n%10;};
const md=v=>String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/[\\`*_{}\[\]()#+.!|>~\-]/g,"\\$&");
function toc(id,label,number){const li=make("li"),link=make("a");link.href="#"+id;if(number!==undefined){const span=make("span",String(number).padStart(2,"0"));span.className="toc-number";link.append(span);}link.append(make("span",label));li.append(link);$("toc").append(li);}
$("title").textContent=data.title;$("summary").textContent=tutorial.summary;$("summary").hidden=!tutorial.summary;$("step-count").textContent=data.steps.length+" 个步骤 · 跟着画面完成操作";$("footer-count").textContent="共 "+data.steps.length+" 个步骤";toc("overview","教程概览");
if(tutorial.prerequisites.length){$("preparation").hidden=false;for(const item of tutorial.prerequisites)$("prerequisites").append(make("li",item));toc("preparation","开始前");}
if(tutorial.example_settings.length){$("settings").hidden=false;for(const item of tutorial.example_settings){const row=make("tr");row.append(make("td",item.label),make("td",item.value));$("settings-body").append(row);}toc("settings","本例参数");}
const video=$("video"),player=$("player");let playback=null,stopAt=null;
function startPlayback(){if(!playback||video.readyState<1)return;video.currentTime=playback.start;stopAt=playback.end;video.play().catch(()=>{$("video-status").textContent="点击视频中的播放按钮开始。";});}
function openVideo(index=null){const step=index===null?null:data.steps[index];const next=step?data.steps[index+1]:null;playback={start:step?step.playback_start_seconds:0,end:step?(step.end_seconds??(next&&next.playback_start_seconds>step.playback_start_seconds?next.playback_start_seconds:null)):null};$("player-title").textContent=step?step.title:"完整录屏";$("player-time").textContent=step?"从 "+time(step.playback_start_seconds)+" 开始":"";$("video-status").textContent="";if(!player.open)player.showModal();startPlayback();}
if(data.video){video.src=local(data.video);$("open-video").hidden=false;$("open-video").addEventListener("click",()=>openVideo());}
video.addEventListener("loadedmetadata",startPlayback);video.addEventListener("timeupdate",()=>{if(stopAt!==null&&video.currentTime>=stopAt){video.pause();stopAt=null;}});video.addEventListener("error",()=>{$("video-status").textContent="视频未能打开，请检查原始录屏文件是否保留在指南目录。";});
$("close-video").addEventListener("click",()=>player.close());player.addEventListener("close",()=>{video.pause();playback=null;stopAt=null;});player.addEventListener("click",event=>{if(event.target===player){const box=player.getBoundingClientRect();if(event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom)player.close();}});
data.steps.forEach((step,index)=>{
 const section=make("section");section.className="step";section.id="step-"+(index+1);const heading=make("div");heading.className="step-heading";const number=make("span",String(index+1).padStart(2,"0"));number.className="step-number";heading.append(number,make("h2",step.title));section.append(heading);
 const timeRow=make("div");timeRow.className="time-row";const timeLabel=make("span","录屏时间 "+time(step.playback_start_seconds));timeLabel.className="time-label";if(data.video){timeLabel.hidden=true;const play=make("button","▶ 播放这一步 · "+time(step.playback_start_seconds));play.className="time-button";play.addEventListener("click",()=>openVideo(index));timeRow.append(play);}timeRow.append(timeLabel);section.append(timeRow);
 if(step.description){const description=make("p",step.description);description.className="step-description";section.append(description);}
 if(step.actions.length){const actions=make("ol");actions.className="actions";for(const action of step.actions)actions.append(make("li",action));section.append(actions);}
 if(step.outcome){const outcome=make("p");outcome.className="outcome";outcome.append(make("strong","完成后"),make("span",step.outcome));section.append(outcome);}
 if(step.image){const figure=make("figure"),link=make("a"),img=make("img");link.href=local(step.image);link.target="_blank";link.rel="noopener noreferrer";link.setAttribute("aria-label","打开步骤 "+(index+1)+" 原图");img.src=local(step.image);img.alt="步骤 "+(index+1)+"："+step.title;const width=data.source.width,height=data.source.height;if(Number.isFinite(width)&&Number.isFinite(height)&&width>0&&height>0&&width<=32768&&height<=32768){img.width=Math.round(width);img.height=Math.round(height);}img.loading="lazy";img.addEventListener("error",()=>{link.hidden=true;const error=make("p","截图未能打开，请检查指南目录中的图片文件。");error.className="image-error";figure.append(error);},{once:true});link.append(img);figure.append(link,make("figcaption","画面 "+time(step.timestamp_seconds)+" · 点击截图查看原图"));section.append(figure);}
 if(step.tip){const tip=make("p");tip.className="tip";tip.append(make("strong","小提示"),make("span",step.tip));section.append(tip);}
 $("steps").append(section);toc(section.id,step.title,index+1);
});
if(tutorial.completion){$("completion").hidden=false;$("completion-text").textContent=tutorial.completion;toc("completion","完成");}
if("IntersectionObserver" in window){const observer=new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting){document.querySelectorAll("#toc a").forEach(link=>link.setAttribute("aria-current",String(link.getAttribute("href")==="#"+entry.target.id)));}},{rootMargin:"-10% 0px -70% 0px",threshold:0});document.querySelectorAll("#overview,.doc-section:not([hidden]),.step,#completion:not([hidden])").forEach(section=>observer.observe(section));}
function markdown(){const lines=["# "+md(data.title),""];if(tutorial.summary)lines.push(md(tutorial.summary),"");if(tutorial.prerequisites.length){lines.push("## 开始前","");tutorial.prerequisites.forEach(item=>lines.push("- "+md(item)));lines.push("");}if(tutorial.example_settings.length){lines.push("## 本例参数","","| 参数 | 设置 |","| --- | --- |");tutorial.example_settings.forEach(item=>lines.push("| "+md(item.label).replace(/\r/g,"").replace(/\n/g,"<br>")+" | "+md(item.value).replace(/\r/g,"").replace(/\n/g,"<br>")+" |"));lines.push("");}data.steps.forEach((step,index)=>{lines.push("## "+(index+1)+". "+md(step.title),"","录屏时间："+time(step.playback_start_seconds),"");if(step.description)lines.push(md(step.description),"");if(step.actions.length){step.actions.forEach((action,i)=>lines.push((i+1)+". "+md(action)));lines.push("");}if(step.outcome)lines.push("**完成后：** "+md(step.outcome),"");if(step.image)lines.push("![步骤 "+(index+1)+"："+md(step.title)+"](<"+local(step.image)+">)","");if(step.tip)lines.push("**小提示：** "+md(step.tip),"");});if(tutorial.completion)lines.push("## 完成","",md(tutorial.completion),"");return lines.join("\n");}
$("download-md").addEventListener("click",()=>{const url=URL.createObjectURL(new Blob([markdown()],{type:"text/markdown;charset=utf-8"})),link=make("a");link.href=url;link.download="guide.md";document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);$("download-status").textContent="已请求下载 guide.md，请查看浏览器下载记录。";});
$("print-guide").addEventListener("click",async()=>{const button=$("print-guide");button.disabled=true;const images=[...document.images];images.forEach(img=>img.loading="eager");await Promise.allSettled(images.map(img=>img.decode()));button.disabled=false;window.print();});
</script>
</body></html>
